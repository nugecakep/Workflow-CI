name: MLflow Project CI Retraining

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Validate MLProject structure
        run: |
          test -f MLProject/MLProject
          test -f MLProject/modelling.py
          test -f MLProject/conda.yaml
          test -f MLProject/breast_cancer_preprocessing/train.csv
          test -f MLProject/breast_cancer_preprocessing/test.csv
          ls -R MLProject

      - name: Run MLflow Project retraining
        run: |
          mlflow run MLProject --env-manager=local

      - name: Show MLflow outputs
        run: |
          find MLProject -maxdepth 4 -type f | sort
          cat MLProject/run_outputs/metrics.json

      - name: Upload MLflow artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-retraining-artifacts
          path: |
            MLProject/mlruns/
            MLProject/run_outputs/
